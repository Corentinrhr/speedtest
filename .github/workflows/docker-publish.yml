name: Build and Publish Docker Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: librespeed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify lockfile exists in repo
        run: |
          echo "Repo root contents:"
          ls -la
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing from the repository. Run 'npm install' locally and commit it."
            exit 1
          fi
          echo "package-lock.json found ($(wc -l < package-lock.json) lines)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagging strategy:
      #   - on 'master'          -> 'latest' AND 'master'
      #   - on any other branch  -> the sanitized branch name
      #   - on a git tag (v*)    -> the semver tag
      #   - always               -> the short git SHA
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
