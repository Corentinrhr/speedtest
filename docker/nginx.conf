user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Speedtest transfers large garbage payloads: disable buffering limits.
    client_max_body_size 0;
    fastcgi_read_timeout 300;

    # gzip for the Angular app, but NEVER for the speedtest backend
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html;
        index index.html;

        # --- Angular frontend (SPA fallback) ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- LibreSpeed PHP backend ---
        location ~ ^/backend/.*\.php$ {
            # Critical: no compression on garbage/empty endpoints,
            # otherwise the speed measurement is wrong.
            gzip off;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Cache static assets aggressively (they are hashed by Angular)
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}