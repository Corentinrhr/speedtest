<div class="action-bar">
  <!-- Start / abort button (Material Design, #D1C4E9) -->
  <button
    type="button"
    class="start-btn"
    [class.running]="running()"
    [disabled]="disabled()"
    (click)="startStop.emit()"
  >
    <i class="pi" [ngClass]="icon()"></i>
    <span class="start-btn-label">{{ label() }}</span>
  </button>

  <!-- Settings icon button -->
  <button
    type="button"
    class="settings-icon-btn"
    (click)="openSettings.emit()"
    aria-label="Test settings"
  >
    <i class="pi pi-cog settings-icon"></i>
  </button>
</div>
