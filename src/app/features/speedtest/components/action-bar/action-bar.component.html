<div class="action-bar">
  <!-- Start / abort button (Material Design, #D1C4E9) -->
  <button
    type="button"
    class="start-btn"
    [class.running]="running()"
    [disabled]="disabled()"
    (click)="startStop.emit()"
  >
    <i class="pi" [ngClass]="icon()"></i>
    <span class="start-btn-label">{{ label() }}</span>
  </button>

  <!-- Settings icon button -->
  <!-- Inline SVG cog so the icon is always visible, even if the
       PrimeIcons font is not loaded (same approach as the sidebar). -->
  <button
    type="button"
    class="settings-icon-btn"
    (click)="openSettings.emit()"
    aria-label="Test settings"
  >
    <svg class="settings-icon" viewBox="0 0 24 24" width="22" height="22"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>
  </button>
</div>
