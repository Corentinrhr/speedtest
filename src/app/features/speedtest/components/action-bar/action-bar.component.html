<div class="action-bar">
  <!-- Big, tall start / abort button -->
  <button
    type="button"
    class="start-btn"
    [class.running]="running()"
    [disabled]="disabled()"
    (click)="startStop.emit()"
  >
    <i class="pi" [ngClass]="icon()"></i>
    <span class="start-btn-label">{{ label() }}</span>
  </button>

  <!-- Settings icon button (replaces the old "Settings" text button) -->
  <button
    type="button"
    class="settings-icon-btn"
    (click)="openSettings.emit()"
    aria-label="Test settings"
    pTooltip="Test settings"
    tooltipPosition="left"
  >
    <i class="pi pi-cog"></i>
  </button>
</div>
