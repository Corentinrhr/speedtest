<div class="speedtest-page">
  <div class="page-header">
    <h1>Speed Test</h1>
    <p class="subtitle">Measure your connection speed</p>
  </div>

  <!-- Server selector -->
  <app-server-selector
    [servers]="servers()"
    [selectedServer]="selectedServer()"
    [disabled]="running()"
    [loading]="serversLoading()"
    (serverChange)="onServerChange($event)"
  />

  <!-- Client IP -->
  @if (data().clientIp) {
    <p class="client-ip">
      <i class="pi pi-globe"></i>
      {{ data().clientIp }}
    </p>
  }

  <!-- Start button -->
  <div class="action-area">
    <p-button
      [label]="buttonLabel()"
      [icon]="buttonIcon()"
      [disabled]="buttonDisabled()"
      [severity]="buttonSeverity()"
      size="large"
      [rounded]="true"
      (onClick)="onStartStop()"
    />
  </div>

  <!-- Phase indicator -->
  @if (currentPhase()) {
    <p class="phase-label">{{ currentPhase() }}</p>
  }

  <!-- Results cards -->
  @if (showResults()) {
    <div class="results-grid">
      <p-card styleClass="result-card">
        <div class="result-content">
          <div class="result-icon download">
            <i class="pi pi-arrow-down"></i>
          </div>
          <div class="result-data">
            <span class="result-label">Download</span>
            <span class="result-value">{{ downloadSpeed() }}</span>
            <span class="result-unit">Mbps</span>
          </div>
        </div>
      </p-card>

      <p-card styleClass="result-card">
        <div class="result-content">
          <div class="result-icon upload">
            <i class="pi pi-arrow-up"></i>
          </div>
          <div class="result-data">
            <span class="result-label">Upload</span>
            <span class="result-value">{{ uploadSpeed() }}</span>
            <span class="result-unit">Mbps</span>
          </div>
        </div>
      </p-card>

      <p-card styleClass="result-card">
        <div class="result-content">
          <div class="result-icon ping">
            <i class="pi pi-clock"></i>
          </div>
          <div class="result-data">
            <span class="result-label">Ping</span>
            <span class="result-value">{{ ping() }}</span>
            <span class="result-unit">ms</span>
          </div>
        </div>
      </p-card>

      <p-card styleClass="result-card">
        <div class="result-content">
          <div class="result-icon jitter">
            <i class="pi pi-wave-pulse"></i>
          </div>
          <div class="result-data">
            <span class="result-label">Jitter</span>
            <span class="result-value">{{ jitter() }}</span>
            <span class="result-unit">ms</span>
          </div>
        </div>
      </p-card>
    </div>
  }
</div>
