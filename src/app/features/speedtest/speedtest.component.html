<div class="speedtest-page">
  <!-- Breadcrumb -->
  <nav class="page-breadcrumb">
    <span class="crumb muted">LibreSpeed</span>
    <i class="pi pi-chevron-right"></i>
    <span class="crumb active">Speed Test</span>
  </nav>

  <!-- Action bar (Start / Abort / Settings) -->
  <p-card styleClass="action-bar-card">
    <app-action-bar
      [label]="buttonLabel()"
      [icon]="buttonIcon()"
      [disabled]="buttonDisabled()"
      [running]="running()"
      (startStop)="onStartStop()"
      (openSettings)="openSettings()"
    />
  </p-card>

  <!-- Results columns -->
  @if (showResults()) {
    <div
      class="results-columns"
      [class.no-latency]="!testPing()"
    >
      <!-- Left column: idle latency card -->
      @if (testPing()) {
        <div class="col-latency">
          <app-latency-card
            [current]="currentPing()"
            [progress]="pingProgress()"
            [history]="historyPing()"
            [stats]="pingStats()"
            [showResults]="showResults()"
            [(collapsed)]="collapsedPing"
          />
        </div>
      }

      <!-- Right column: download + upload speed cards -->
      <div class="col-speeds">
        @if (testDl()) {
          <app-speed-card
            kind="dl"
            [current]="currentDl()"
            [progress]="dlProgress()"
            [history]="historyDl()"
            [stats]="dlStats()"
            [showResults]="showResults()"
            [(collapsed)]="collapsedDl"
          />
        }

        @if (testUl()) {
          <app-speed-card
            kind="ul"
            [current]="currentUl()"
            [progress]="ulProgress()"
            [history]="historyUl()"
            [stats]="ulStats()"
            [showResults]="showResults()"
            [(collapsed)]="collapsedUl"
          />
        }
      </div>
    </div>
  }

  <!-- Final results card (shown when test is finished) -->
  @if (finished()) {
    <app-final-results
      [download]="downloadResult()"
      [upload]="uploadResult()"
      [ping]="pingResult()"
      [jitter]="jitterResult()"
      [downloadLoss]="downloadLossResult()"
      [uploadLoss]="uploadLossResult()"
      [idleLoss]="idleLossResult()"
      [testDate]="finalResultsDate()"
    />
  }

  <!-- Settings dialog -->
  <app-settings-dialog
    [(visible)]="showSettings"
    [(testPing)]="testPing"
    [(testDl)]="testDl"
    [(testUl)]="testUl"
    [(durationPing)]="durationPing"
    [(durationDl)]="durationDl"
    [(durationUl)]="durationUl"
    [(loadedLatency)]="loadedLatency"
  />
</div>
