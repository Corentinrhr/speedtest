<div class="speedtest-page">
  <!-- Breadcrumb -->
  <div class="page-breadcrumb">
    <i class="pi pi-caret-left"></i>
    <span class="crumb muted">LibreSpeed</span>
    <i class="pi pi-caret-right"></i>
    <span class="crumb active">Speedtest</span>
    <i class="pi pi-caret-left"></i>
  </div>

  <!-- Barre d'action -->
  <p-card styleClass="action-bar-card">
    <div class="action-bar">
      <p-button
        [label]="buttonLabel()"
        [icon]="buttonIcon()"
        [disabled]="buttonDisabled()"
        [severity]="running() ? 'danger' : 'primary'"
        styleClass="start-btn"
        (onClick)="onStartStop()"
      />
      <p-button
        label="Settings"
        icon="pi pi-cog"
        [text]="true"
        severity="secondary"
        styleClass="settings-btn"
        (onClick)="toggleServerSelector()"
      />
    </div>
  </p-card>

  <!-- Selecteur serveur -->
  @if (showServerSelector()) {
    <app-server-selector
      [servers]="servers()"
      [selectedServer]="selectedServer()"
      [disabled]="running()"
      [loading]="serversLoading()"
      (serverChange)="onServerChange($event)"
    />
  }

  <!-- Contenu principal -->
  <p-card styleClass="main-card">
    <div class="main-grid">
      <!-- Colonne gauche : gauge SVG -->
      <div class="gauge-panel">
        <div class="gauge-header">
          <span class="gauge-title"></span>
          <i class="pi pi-info-circle info-icon"></i>
        </div>

        <div class="gauge-percent">%</div>
        <div class="gauge-percent-label">Completed</div>

        <div class="gauge-svg-wrap">
          <svg viewBox="0 0 220 200" class="gauge-svg">
            <defs>
              <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#7c3aed" />
              </linearGradient>
            </defs>

            <path [attr.d]="gaugeBgPath()" class="gauge-arc-bg" />
            <path [attr.d]="gaugeValuePath()" class="gauge-arc-value" />

            @for (tick of gaugeTickMarks(); track tick.val) {
              <line
                [attr.x1]="tick.x1" [attr.y1]="tick.y1"
                [attr.x2]="tick.x2" [attr.y2]="tick.y2"
                class="gauge-tick"
              />
              <text
                [attr.x]="tick.lx" [attr.y]="tick.ly"
                class="gauge-tick-label"
                text-anchor="middle" dominant-baseline="middle"
              ></text>
            }

            <text x="110" y="118" class="gauge-center-val" text-anchor="middle">
              
            </text>
            <text x="110" y="136" class="gauge-center-unit" text-anchor="middle">
              Mb/s
            </text>
          </svg>
        </div>

        @if (showResults()) {
          <div class="gauge-stats">
            <div><span>Average :</span>  Mb/s</div>
            <div><span>Median :</span>  Mb/s</div>
            <div><span>Max :</span>  Mb/s</div>
          </div>
        }
      </div>

      <!-- Colonne droite : graphe temps reel -->
      <div class="chart-panel">
        <p-chart type="line" [data]="chartData()" [options]="chartOptions" height="380px" />
      </div>
    </div>
  </p-card>

  <!-- Resultats finaux -->
  @if (finished()) {
    <div class="final-results">
      <div class="fr-item">
        <i class="pi pi-arrow-down dl"></i>
        <span class="fr-label">Download</span>
        <span class="fr-val"> <small>Mbps</small></span>
      </div>
      <div class="fr-item">
        <i class="pi pi-arrow-up ul"></i>
        <span class="fr-label">Upload</span>
        <span class="fr-val"> <small>Mbps</small></span>
      </div>
      <div class="fr-item">
        <i class="pi pi-clock pg"></i>
        <span class="fr-label">Ping</span>
        <span class="fr-val"> <small>ms</small></span>
      </div>
      <div class="fr-item">
        <i class="pi pi-wave-pulse jt"></i>
        <span class="fr-label">Jitter</span>
        <span class="fr-val"> <small>ms</small></span>
      </div>
    </div>
  }
</div>
