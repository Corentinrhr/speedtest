<div class="speedtest-page">
  <!-- Breadcrumb -->
  <div class="page-breadcrumb">
    <i class="pi pi-caret-right"></i>
    <span class="crumb muted">LibreSpeed</span>
    <i class="pi pi-caret-right"></i>
    <span class="crumb active">Speedtest</span>
  </div>

  <!-- Action bar (nicer, taller start button + settings icon) -->
  <p-card styleClass="action-bar-card">
    <app-action-bar
      [label]="buttonLabel()"
      [icon]="buttonIcon()"
      [disabled]="buttonDisabled()"
      [running]="running()"
      (startStop)="onStartStop()"
      (openSettings)="openSettings()"
    />
  </p-card>

  <!-- Server selector -->
  @if (showServerSelector()) {
    <app-server-selector
      [servers]="servers()"
      [selectedServer]="selectedServer()"
      [disabled]="running()"
      [loading]="serversLoading()"
      (serverChange)="onServerChange($event)"
    />
  }

  <!-- Two columns: Latency (left) + stacked DL/UL (right) -->
  <div class="results-columns" [class.no-latency]="!testPing()">
    <!-- Left column: Latency -->
    @if (testPing()) {
      <div class="col-latency">
        <app-latency-card
          [current]="currentPing()"
          [progress]="pingProgress()"
          [history]="historyPing()"
          [stats]="pingStats()"
          [showResults]="showResults()"
          [(collapsed)]="collapsedPing"
        />
      </div>
    }

    <!-- Right column: Download + Upload stacked -->
    <div class="col-speeds">
      @if (testDl()) {
        <app-speed-card
          kind="dl"
          [current]="currentDl()"
          [progress]="dlProgress()"
          [history]="historyDl()"
          [stats]="dlStats()"
          [showResults]="showResults()"
          [(collapsed)]="collapsedDl"
        />
      }

      @if (testUl()) {
        <app-speed-card
          kind="ul"
          [current]="currentUl()"
          [progress]="ulProgress()"
          [history]="historyUl()"
          [stats]="ulStats()"
          [showResults]="showResults()"
          [(collapsed)]="collapsedUl"
        />
      }
    </div>
  </div>

  <!-- Final results -->
  @if (finished()) {
    <app-final-results
      [download]="downloadResult()"
      [upload]="uploadResult()"
      [ping]="pingResult()"
      [jitter]="jitterResult()"
    />
  }
</div>

<!-- Settings dialog -->
<app-settings-dialog
  [(visible)]="showSettings"
  [(testPing)]="testPing"
  [(testDl)]="testDl"
  [(testUl)]="testUl"
  [(durationPing)]="durationPing"
  [(durationDl)]="durationDl"
  [(durationUl)]="durationUl"
  [(loadedLatency)]="loadedLatency"
/>
