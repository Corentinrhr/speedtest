<div class="dashboard-layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img
        src="assets/images/icon.png"
        alt="LibreSpeed"
        class="sidebar-logo"
        [class.hidden]="sidebarCollapsed()"
      />
      <button
        type="button"
        class="toggle-btn"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand menu' : 'Collapse menu'"
        title="Toggle menu"
      >
        <i class="pi" [ngClass]="sidebarCollapsed() ? 'pi-bars' : 'pi-angle-left'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <i [class]="item.icon"></i>
          <span class="nav-label" [class.hidden]="sidebarCollapsed()">
            {{ item.label }}
          </span>
        </a>
      }
    </nav>

    <div class="sidebar-footer" [class.hidden]="sidebarCollapsed()">
      <span class="version-tag">LibreSpeed Angular</span>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
