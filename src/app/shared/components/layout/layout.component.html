<div class="dashboard-layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img
        src="assets/images/icon.png"
        alt="LibreSpeed"
        class="sidebar-logo"
        [class.hidden]="sidebarCollapsed()"
      />
      <button
        type="button"
        class="toggle-btn"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand menu' : 'Collapse menu'"
        title="Toggle menu"
      >
        <!-- Inline SVG so the button is always visible, even if the
             PrimeIcons font is not loaded. -->
        @if (sidebarCollapsed()) {
          <!-- Hamburger icon (expand) -->
          <svg class="toggle-icon" viewBox="0 0 24 24" width="22" height="22"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        } @else {
          <!-- Chevron-left icon (collapse) -->
          <svg class="toggle-icon" viewBox="0 0 24 24" width="22" height="22"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        }
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <i [class]="item.icon"></i>
          <span class="nav-label" [class.hidden]="sidebarCollapsed()">
            {{ item.label }}
          </span>
        </a>
      }
    </nav>

    <div class="sidebar-footer" [class.hidden]="sidebarCollapsed()">
      <span class="version-tag">LibreSpeed Angular</span>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
